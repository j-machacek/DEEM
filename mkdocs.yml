# Equivalent configuration in mkdocs.yml form.
#
# Zensical reads mkdocs.yml natively as a transition mechanism, so this file is
# provided as a migration aid for users coming from Material for MkDocs. The
# canonical configuration for this project is zensical.toml; keep the two in sync
# or delete this file once you have fully moved to Zensical.

site_name: DEEM
site_url: https://j-machacek.github.io/DEEM/
site_description: >-
  DEEM — Differential Evolution with Elitism and Multi-populations. A heuristic
  optimiser of the DE family with sub-populations, elitism and a diversity-based
  restart strategy, and its improved variant DEEMI.
site_author: Jan Machaček
copyright: "&copy; 2023–2026 Jan Machaček"

repo_url: https://github.com/j-machacek/DEEM
repo_name: j-machacek/DEEM

docs_dir: docs
site_dir: site

theme:
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to light mode

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - Theory:
      - theory/index.md
      - theory/sub-populations.md
      - theory/position-updates.md
      - theory/boundary-conditions.md
      - theory/reinitialisation.md
      - theory/parameters.md
  - DEEMI (improved): deemi.md
  - Examples:
      - examples/benchmarks.md
      - examples/calibration.md
  - API reference:
      - reference/deem.md
      - reference/deemi.md
      - reference/modules.md
  - Citation: citation.md
