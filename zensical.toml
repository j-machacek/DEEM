[project]
site_name = "DEEM"
site_url = "https://j-machacek.github.io/DEEM/"
site_description = "DEEM — Differential Evolution with Elitism and Multi-populations. A heuristic optimiser of the DE family with sub-populations, elitism and a diversity-based restart strategy, and its improved variant DEEMI."
site_author = "Jan Machaček"
copyright = "&copy; 2023–2026 Jan Machaček"

repo_url = "https://github.com/j-machacek/DEEM"
repo_name = "j-machacek/DEEM"

docs_dir = "docs"
site_dir = "site"

# KaTeX for the equations in the theory part
extra_javascript = [
    "javascripts/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]
extra_css = [
    "https://unpkg.com/katex@0/dist/katex.min.css",
    "stylesheets/extra.css",
]

nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        "getting-started/installation.md",
        "getting-started/quickstart.md",
    ] },
    { "Theory" = [
        "theory/index.md",
        "theory/sub-populations.md",
        "theory/position-updates.md",
        "theory/boundary-conditions.md",
        "theory/reinitialisation.md",
        "theory/parameters.md",
    ] },
    { "DEEMI (improved)" = "deemi.md" },
    { "Examples" = [
        "examples/benchmarks.md",
        "examples/calibration.md",
    ] },
    { "API reference" = [
        "reference/deem.md",
        "reference/deemi.md",
        "reference/modules.md",
    ] },
    { "Citation" = "citation.md" },
]

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tracking",
    "toc.follow",
    "content.code.copy",
    "search.suggest",
    "search.highlight",
]

# Light / dark palette toggle (matches the numgeo / numgeo-pfem sites)
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
